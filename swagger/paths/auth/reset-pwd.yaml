post:
  tags:
    - Auth
  summary: Reset password
  operationId: resetPassword
  description: Reset password using token (token from reset email).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - password
            - token
          properties:
            password:
              type: string
              example: 'NewPassword123!'
            token:
              type: string
              example: 'jwt-token-from-email'
  responses:
    '200':
      description: Password has been successfully reset.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Password has been successfully reset.
              data:
                type: object
    '400':
      description: Bad Request — missing or invalid password/token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Invalid token or password format'
