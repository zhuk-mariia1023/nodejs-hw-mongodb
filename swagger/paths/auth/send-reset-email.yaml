post:
  tags:
    - Auth
  summary: Send reset password email
  operationId: sendResetEmail
  description: Sends an email with a reset link (link contains token). Uses configured SMTP.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
              example: 'mariia@example.com'
  responses:
    '200':
      description: Reset password email has been successfully sent.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Reset password email has been successfully sent.
              data:
                type: object
    '400':
      description: Bad Request — invalid or missing email
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Invalid email address'
