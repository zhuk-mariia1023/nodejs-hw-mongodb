tags:
  - Contacts
summary: Update a contact by id
operationId: updateContact
description: Update contact fields. Body must be multipart/form-data (photo — optional binary).
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    example: '68b354511b4e6fbf671877ad'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Donna Zhuk'
          phoneNumber:
            type: string
            example: '+310000000005'
          email:
            type: string
            format: email
            example: 'donna@example.com'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: home
          photo:
            type: string
            format: binary
            description: Upload image file to replace current photo
responses:
  '200':
    description: Successfully patched a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
